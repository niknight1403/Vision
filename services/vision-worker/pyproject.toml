[project]
name = "autonomagent-vision-worker"
version = "0.1.0"
description = "Safe, asynchronous visual inspection worker for AutonomAgent"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "httpcore>=1.0.9,<2",
  "certifi>=2024.2.2",
  "openai>=1.40,<3",
  "pydantic>=2.7,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
