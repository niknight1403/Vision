name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vision-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/vision-worker
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/vision-worker/pyproject.toml
      - name: Install vision worker and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run vision worker tests
        run: python -m pytest -q

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: autonomagent_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autonomagent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autonomagent_test?schema=public
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install from lockfile
        run: npm ci
      - name: Validate local and cloud Compose configuration
        env:
          POSTGRES_PASSWORD: ci-postgres-password-not-a-secret
          REDIS_PASSWORD: ci-redis-password-not-a-secret
          VISION_WORKER_TOKEN: ci-vision-worker-token-not-a-secret
          VISION_ALLOWED_IMAGE_HOSTS: images.example.com
          AUTH_SIGNING_SECRET: ci-auth-signing-secret-not-a-secret
        run: docker compose -f infra/docker-compose.yml config --quiet
      - name: Validate Expo dependency compatibility
        working-directory: apps/mobile
        run: npx expo-doctor
      - name: Enforce the PAPER trading lockdown
        working-directory: apps/mobile
        run: npm run verify:paper
      - name: Generate Prisma Client
        run: npx prisma generate --schema services/api/prisma/schema.prisma
      - name: Validate schema and apply migrations
        run: |
          npx prisma validate --schema services/api/prisma/schema.prisma
          npx prisma migrate deploy --schema services/api/prisma/schema.prisma
      - name: Build API
        run: npm run build --workspace @autonomagent/api
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Run unit and PostgreSQL integration tests
        run: npm test
      - name: Audit API production dependency closure
        shell: bash
        run: |
          audit_status=0
          npm audit --omit=dev --workspace @autonomagent/api --audit-level=high --json > api-production-audit.json || audit_status=$?
          echo "API production audit exit code: ${audit_status}"
          exit "${audit_status}"
      - name: Upload API production audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-production-audit-${{ github.sha }}
          path: api-production-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Block high and critical dependency advisories
        id: dependency-audit
        shell: bash
        run: |
          audit_status=0
          npm audit --audit-level=high --json > npm-audit-report.json || audit_status=$?
          echo "npm audit exit code: ${audit_status}"
          exit "${audit_status}"
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.sha }}
          path: npm-audit-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Export Android JavaScript bundle
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/autonomagent-android-export
      - name: Upload Android JS bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: autonomagent-android-js-${{ github.sha }}
          path: /tmp/autonomagent-android-export/
          if-no-files-found: error
          retention-days: 14
